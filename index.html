<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>Soumya Ranjan Das — Independent Web Designer &amp; Developer</title>
    <meta name="description" content="Independent web designer and developer based in Bhubaneswar, India. I design and build business websites, online stores, landing pages and web applications with a point of view." />
    <meta name="author" content="Soumya Ranjan Das" />
    <meta name="keywords" content="web designer, web developer, freelance web design, React developer, TypeScript, GSAP, portfolio, Bhubaneswar, India" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Canonical -->
    <link rel="canonical" href="https://daswebsolutions.me/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Soumya Ranjan Das" />
    <meta property="og:title" content="Soumya Ranjan Das — Independent Web Designer &amp; Developer" />
    <meta property="og:description" content="Independent web designer and developer based in Bhubaneswar, India. Websites with a point of view." />
    <meta property="og:url" content="https://daswebsolutions.me/" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@daswebsolutions" />
    <meta name="twitter:creator" content="@daswebsolutions" />
    <meta name="twitter:title" content="Soumya Ranjan Das — Independent Web Designer &amp; Developer" />
    <meta name="twitter:description" content="Independent web designer and developer. Websites with a point of view." />

    <!-- Sitemap reference -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Preconnect for Google Fonts (performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts: preloaded for LCP performance -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@400;600;700&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@400;600;700&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <!-- Noscript fallback for font loading -->
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@400;600;700&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Motion detection inline script -->
    <script>
      (function() {
        try {
          var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!prefersReduced) {
            document.documentElement.classList.add('js-motion');
            setTimeout(function() {
              document.documentElement.classList.remove('js-motion-pending');
            }, 2500);
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="transition-portal"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
